<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GP Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b12;--card:#14141f;--line:#ffffff12;--txt:#f1f0f7;--mut:#9b99ad;--a1:#7c5cff;--a2:#3fb8ff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:Manrope,sans-serif;font-weight:500;overflow-x:hidden}
a{color:inherit;text-decoration:none}

/* мягкий фон */
.glow{position:fixed;width:600px;height:600px;border-radius:50%;filter:blur(140px);opacity:.18;z-index:-1;animation:float 20s ease-in-out infinite}
.g1{background:var(--a1);top:-200px;left:-150px}
.g2{background:var(--a2);bottom:-250px;right:-200px;animation-delay:-10s}
@keyframes float{50%{transform:translate(60px,40px)}}

/* шапка */
nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:min(1100px,calc(100% - 32px));display:flex;justify-content:space-between;align-items:center;padding:12px 22px;border:1px solid var(--line);border-radius:16px;background:#0b0b12cc;backdrop-filter:blur(12px);z-index:10}
.logo{font-family:Unbounded;font-weight:800;font-size:18px}
.logo span{color:var(--a1)}
nav .links{display:flex;gap:24px;color:var(--mut)}
nav .links a:hover{color:var(--txt)}

.btn{display:inline-block;padding:14px 26px;border-radius:12px;font-weight:700;background:var(--a1);transition:transform .25s,background .25s}
.btn:hover{transform:translateY(-2px);background:#8d71ff}
.btn.ghost{background:transparent;border:1px solid #ffffff26}
.btn.ghost:hover{background:#ffffff0d}

section{width:min(1100px,calc(100% - 32px));margin:0 auto;padding:100px 0}

/* первый экран */
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
h1{font-family:Unbounded;font-weight:800;font-size:clamp(48px,10vw,120px);line-height:1;letter-spacing:-2px}
h1 .ch{display:inline-block;opacity:0;transform:translateY(50px);animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}
h1 .acc{color:var(--a1)}
@keyframes up{to{opacity:1;transform:none}}
.hero .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:48px;opacity:0;animation:up .8s .9s forwards}
.scroll-hint{position:absolute;bottom:30px;left:50%;width:22px;height:36px;border:2px solid #ffffff40;border-radius:12px;transform:translateX(-50%)}
.scroll-hint::after{content:"";position:absolute;left:50%;top:7px;width:4px;height:7px;border-radius:2px;background:var(--txt);transform:translateX(-50%);animation:wheel 1.6s infinite}
@keyframes wheel{to{transform:translate(-50%,12px);opacity:0}}

/* проекты */
h2{font-family:Unbounded;font-weight:800;font-size:clamp(28px,4.5vw,44px);margin-bottom:28px}
h2 span{color:var(--a1)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.filters button{background:var(--card);border:1px solid var(--line);color:var(--mut);padding:9px 18px;border-radius:10px;font:700 14px Manrope;cursor:pointer;transition:.2s}
.filters button:hover{color:var(--txt)}
.filters button.on{color:#fff;background:var(--a1);border-color:var(--a1)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .2s,border-color .3s}
.card:hover{border-color:#7c5cff66}
.card.hide{display:none}
.thumb{aspect-ratio:16/10;position:relative;display:grid;place-items:center;overflow:hidden;font-family:Unbounded;font-weight:800;font-size:56px;color:#ffffffd9}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .thumb img{transform:scale(1.05)}
.body{padding:18px 20px 20px}
.type{font-size:13px;color:var(--a2)}
.body h3{font-size:19px;margin:4px 0 8px}
.body p{color:var(--mut);font-size:14px;line-height:1.5}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.price{font-weight:700}
.meta .btn{padding:9px 16px;font-size:14px;border-radius:10px}
.btn.wait{background:#ffffff0f;color:var(--mut);cursor:default}
.btn.wait:hover{transform:none;background:#ffffff0f}

/* статусы: скоро / в разработке */
.status{position:absolute;top:12px;left:12px;font:700 12px Manrope;padding:6px 10px;border-radius:8px;backdrop-filter:blur(6px);display:flex;align-items:center;gap:6px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:blink 1.4s infinite}
.status.soon{background:#0b0b12b3;color:#f5c542}
.status.dev{background:#0b0b12b3;color:#ff8a3d}
@keyframes blink{50%{opacity:.25}}
.card.upcoming .thumb img,.card.upcoming .thumb{filter:saturate(.75)}
.countdown{margin-top:14px;padding:12px;border-radius:12px;background:#f5c54212;border:1px solid #f5c54233}
.countdown small{color:#f5c542;font-size:12px}
.countdown div{display:flex;gap:8px;margin-top:6px}
.countdown b{flex:1;text-align:center;font:800 20px Unbounded;background:#0b0b12;border-radius:8px;padding:8px 0}
.countdown em{display:block;font:500 11px Manrope;color:var(--mut);font-style:normal;margin-top:2px}
.progress{margin-top:14px}
.progress .bar{height:8px;border-radius:99px;background:#ffffff12;overflow:hidden}
.progress i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ff8a3d,#f5c542);transition:width 1.4s cubic-bezier(.2,.8,.2,1) .3s}
.card.in .progress i{width:var(--w)}
.progress span{display:block;font-size:12px;color:var(--mut);margin-top:6px}

/* соцсети */
.socials{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.soc{display:flex;align-items:center;gap:14px;padding:18px;border-radius:16px;background:var(--card);border:1px solid var(--line);transition:transform .25s,border-color .25s}
.soc:hover{transform:translateY(-4px);border-color:var(--c)}
.soc .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:700;background:var(--c);flex:none}
.soc small{color:var(--mut);display:block;font-size:13px}

footer{text-align:center;color:var(--mut);padding:32px 16px;border-top:1px solid var(--line);font-size:14px}

.reveal{opacity:0;transform:translateY(30px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}
@media(max-width:600px){nav .links{gap:14px;font-size:14px}.logo{font-size:15px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}h1 .ch,.hero .row,.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>

<nav>
  <a href="#" class="logo">GP <span>Market</span></a>
  <div class="links"><a href="#projects">Проекты</a><a href="#socials">Соцсети</a></div>
</nav>

<section class="hero">
  <h1 id="title">GP Market</h1>
  <div class="row"><a href="#projects" class="btn">Смотреть проекты</a><a href="#socials" class="btn ghost">Мои соцсети</a></div>
  <div class="scroll-hint"></div>
</section>

<section id="projects">
  <h2 class="reveal">Мои <span>проекты</span></h2>
  <div class="filters reveal" id="filters"></div>
  <div class="cards" id="cards"></div>
</section>

<section id="socials">
  <h2 class="reveal">Мои <span>соцсети</span></h2>
  <div class="socials" id="socs"></div>
</section>

<footer>© 2026 GP Market</footer>

<script src="projects.js"></script>
<script>
/* ===== Твои проекты и соцсети — меняй тут ===== */
// проекты лежат в projects.js — добавляй их через admin.html
const projects=window.PROJECTS||[];
const socials=[
 {name:"YouTube",   handle:"@gamekompanet_Official", color:"#e5282f", url:"https://www.youtube.com/@gamekompanet_Official"},
 {name:"Telegram",  handle:"t.me/Gamekompanet_on",   color:"#229ed9", url:"https://t.me/Gamekompanet_on"},
 {name:"Discord",   handle:"Сервер сообщества",      color:"#5865f2", url:"https://discord.gg/qATSyZySA4"},
];
/* ============================================== */

// заголовок — буквы появляются по очереди
const T=document.getElementById('title');
T.innerHTML=[...T.textContent].map((ch,i)=>ch===' '?' ':`<span class="ch ${i>2?'acc':''}" style="animation-delay:${i*.06}s">${ch}</span>`).join('');

// карточки проектов
const cards=document.getElementById('cards');
// если дата выхода уже наступила — проект считается вышедшим
const stOf=p=>p.status==='soon'&&p.release&&new Date(p.release)<=new Date()?'released':(p.status||'released');
cards.innerHTML=projects.map(p=>{const st=stOf(p);
 const badge=st==='soon'?'<span class="status soon">Скоро выйдет</span>':st==='dev'?'<span class="status dev">В разработке</span>':'';
 let extra='';
 if(st==='soon'&&p.release)extra=`<div class="countdown" data-to="${p.release}"></div>`;
 if(st==='dev')extra=`<div class="progress"><div class="bar"><i style="--w:${p.progress??0}%"></i></div><span>Готово на ${p.progress??0}%</span></div>`;
 const action=st==='released'?`<a class="btn" href="${p.url}" target="_blank" rel="noopener">Открыть</a>`:`<span class="btn wait">${st==='soon'?'Скоро':'В работе'}</span>`;
 return `<div class="card reveal ${st!=='released'?'upcoming':''}" data-type="${p.type}">
 <div class="thumb" style="background:${p.color}">${p.img?`<img src="${p.img}" alt="${p.title}">`:p.title[0]}${badge}</div>
 <div class="body"><span class="type">${p.type}</span><h3>${p.title}</h3><p>${p.desc}</p>${extra}
 <div class="meta"><span class="price">${p.price}</span>${action}</div></div></div>`}).join('');

// обратный отсчёт до выхода
const plural=(n,a,b,c)=>n%10===1&&n%100!==11?a:n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?b:c;
function tickCountdowns(){document.querySelectorAll('.countdown').forEach(el=>{
 let s=Math.max(0,Math.floor((new Date(el.dataset.to)-new Date())/1000));
 if(!s){location.reload();return}
 const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;
 el.innerHTML=`<small>До выхода</small><div>${[[d,'дн'],[h,'ч'],[m,'мин'],[sec,'сек']].map(([v,u])=>`<b>${String(v).padStart(2,'0')}<em>${u}</em></b>`).join('')}</div>`})}
tickCountdowns();setInterval(tickCountdowns,1000);

// фильтр
const types=["Все",...new Set(projects.map(p=>p.type))];
const fl=document.getElementById('filters');
fl.innerHTML=types.map((t,i)=>`<button class="${i?'':'on'}">${t}</button>`).join('');
fl.onclick=e=>{if(e.target.tagName!=='BUTTON')return;
 fl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===e.target));
 const t=e.target.textContent;
 document.querySelectorAll('.card').forEach(c=>c.classList.toggle('hide',t!=='Все'&&c.dataset.type!==t));};

// лёгкий 3D-наклон карточек
document.querySelectorAll('.card').forEach(c=>{
 c.onmousemove=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  c.style.transform=`perspective(900px) rotateY(${x*6}deg) rotateX(${-y*6}deg) translateY(-4px)`};
 c.onmouseleave=()=>c.style.transform='';
});

// соцсети
document.getElementById('socs').innerHTML=socials.map(s=>`<a class="soc reveal" href="${s.url}" target="_blank" rel="noopener" style="--c:${s.color}">
 <span class="ic">${s.name[0]}</span><div><b>${s.name}</b><small>${s.handle}</small></div></a>`).join('');

// плавная прокрутка
document.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener('click',e=>{
 const id=a.getAttribute('href');const el=id==='#'?document.body:document.querySelector(id);if(!el)return;e.preventDefault();
 const from=scrollY,to=id==='#'?0:el.getBoundingClientRect().top+scrollY-90,t0=performance.now(),dur=900;
 (function step(t){const k=Math.min((t-t0)/dur,1),ease=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
  scrollTo(0,from+(to-from)*ease);if(k<1)requestAnimationFrame(step)})(t0);
}));

// плавное появление
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.reveal').forEach((el,i)=>{el.style.transitionDelay=(i%3)*.08+'s';io.observe(el)});
</script>
</body>
</html>
